<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Anna University Regional Campus - Tirunelveli for admissions and inquiries">
    
    <title>Contact Us | AURCT</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-6);
            margin-bottom: var(--spacing-12);
        }

        .contact-card {
            text-align: center;
            padding: var(--spacing-8);
        }

        .contact-card-icon {
            width: 80px;
            height: 80px;
            background-color: var(--primary-color);
            color: var(--white);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto var(--spacing-4);
        }

        .contact-card h4 {
            margin-bottom: var(--spacing-3);
        }

        .contact-card p {
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        .contact-form-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-8);
        }

        .contact-form {
            background-color: var(--white);
            padding: var(--spacing-8);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .form-group {
            margin-bottom: var(--spacing-4);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--spacing-2);
            font-weight: var(--font-weight-medium);
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: var(--spacing-3) var(--spacing-4);
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            transition: border-color var(--transition-fast);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        .contact-map {
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            height: 100%;
            min-height: 400px;
        }

        .contact-map iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 1024px) {
            .contact-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .contact-form-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader-overlay">
        <div class="loader"></div>
    </div>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Page Header -->
    <section class="page-header" style="background-image: url('assets/images/slide-1.jpg');">
        <div class="page-header-content">
            <h1 class="page-header-title">Contact Us</h1>
            <ul class="breadcrumb">
                <li><a href="index.html">Home</a></li>
                <li class="current">Contact Us</li>
            </ul>
        </div>
    </section>

    <!-- Contact Info Cards -->
    <section class="section">
        <div class="container">
            <div class="contact-grid">
                <div class="card contact-card">
                    <div class="contact-card-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <h4>Our Location</h4>
                    <p>Anna University Regional Campus<br>
                       Tirunelveli - 627007<br>
                       Tamil Nadu, India</p>
                </div>

                <div class="card contact-card">
                    <div class="contact-card-icon">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                    <h4>Phone Number</h4>
                    <p>+91 462 2551298<br>
                       +91 462 2551299<br>
                       (Mon-Sat: 9AM - 5PM)</p>
                </div>

                <div class="card contact-card">
                    <div class="contact-card-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <h4>Email Address</h4>
                    <p>helpdesk@auttvl.ac.in<br>
                       admissions@auttvl.ac.in<br>
                       info@auttvl.ac.in</p>
                </div>
            </div>

            <!-- Contact Form & Map -->
            <div class="contact-form-section">
                <div class="contact-form">
                    <h3 class="mb-6">Send us a Message</h3>
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="subject">Subject *</label>
                            <input type="text" id="subject" name="subject" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message *</label>
                            <textarea id="message" name="message" class="form-control" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-full">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                </div>

                <div class="contact-map">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3944.048476076911!2d77.72352431532853!3d8.68694029664295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b04126b9cf8ff7d%3A0xe818c690ce42ee03!2sAnna+University+Regional+Campus!5e0!3m2!1sen!2sin!4v1555306115553!5m2!1sen!2sin"
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript -->
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Contact Form Handling
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form data
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Here you would typically send the data to a server
            console.log('Form submitted:', data);
            
            // Show success message
            alert('Thank you for your message! We will get back to you soon.');
            
            // Reset form
            this.reset();
        });
    </script>
</body>
</html>
